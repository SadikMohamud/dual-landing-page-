<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursor Hover Mask — HTML CSS JS GSAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="main">
    <div class="mask" id="mask">
      <p id="mask-target">
        A visual designer — with skills that haven’t been replaced by A.I. yet — making good work only when the paycheck is equally good.
      </p>
    </div>

    <div class="body">
      <p>
        I’m a <span>selectively skilled</span> product designer with a strong focus on producing high quality and impactful digital experiences.
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
